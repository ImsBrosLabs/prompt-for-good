# pfg-runner configuration
# Copy this to pfg.yaml and fill in your values.
# pfg.yaml is gitignored — never commit it.

llm:
  provider: claude                          # claude | openai | gemini (future)
  api_key: ${ANTHROPIC_API_KEY}
  model: claude-sonnet-4-6
  max_tokens_per_day: 100000               # your daily token budget

schedule:
  active_hours: "20:00-23:00"             # only process issues during these hours
  timezone: "Europe/Paris"                # your local timezone

hub:
  url: https://hub.promptforgood.dev
  token: ${PFG_TOKEN}                     # token received after runner registration

contributor:
  name: "YourName"                        # your name or GitHub handle
  github_token: ${GITHUB_TOKEN}           # GitHub PAT with repo scope

project_preferences:
  languages: ["python", "typescript"]     # empty list means no language constraint
  ecosystems: ["npm", "pip"]              # match at least one listed ecosystem
  allow_repos: []                         # owner/repo only; empty means any repo
  block_repos: ["owner/repo-to-avoid"]    # owner/repo only; always excluded
  labels: ["bug", "good first issue"]     # match at least one listed issue label
  licenses: ["mit", "apache-2.0"]         # empty list means no license constraint
  max_difficulty: "medium"                # easy | medium | hard
  max_estimated_minutes: 120              # reject larger estimated runtime
