services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pfg
      POSTGRES_USER: pfg
      POSTGRES_PASSWORD: pfg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfg -d pfg"]
      interval: 5s
      timeout: 5s
      retries: 10

  hub:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgresql://pfg:pfg@postgres:5432/pfg
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - hub_node_modules:/workspace/node_modules

volumes:
  postgres_data:
  hub_node_modules:
