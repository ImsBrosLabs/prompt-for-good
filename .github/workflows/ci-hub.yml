name: pfg-hub CI

on:
  push:
    paths:
      - 'pfg-hub/**'
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'pfg-hub/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pfg-hub

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pfg_test
          POSTGRES_USER: pfg
          POSTGRES_PASSWORD: pfg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pfg-hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI types
        run: npm run generate:openapi-types

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Migrate test database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://pfg:pfg@localhost:5432/pfg_test

      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgresql://pfg:pfg@localhost:5432/pfg_test
          RUN_DB_TESTS: 'true'
          ADMIN_KEY: test-admin-key
          GITHUB_TOKEN: dummy
