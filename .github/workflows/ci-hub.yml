name: pfg-hub CI

on:
  push:
    paths:
      - 'pfg-hub/**'
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'pfg-hub/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pfg-hub

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pfg_test
          POSTGRES_USER: pfg
          POSTGRES_PASSWORD: pfg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pfg -d pfg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pfg-hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI types
        run: npm run generate:openapi-types

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Wait for test database
        run: |
          node <<'EOF'
          const { Pool } = require("pg");

          const connectionString = process.env.DATABASE_URL;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function main() {
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              const pool = new Pool({ connectionString });
              try {
                await pool.query("SELECT 1");
                await pool.end();
                return;
              } catch (error) {
                await pool.end().catch(() => undefined);
                if (attempt === 30) {
                  throw error;
                }
                await sleep(1000);
              }
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF
        env:
          DATABASE_URL: postgresql://pfg:pfg@127.0.0.1:5432/pfg_test

      - name: Migrate test database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://pfg:pfg@127.0.0.1:5432/pfg_test

      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgresql://pfg:pfg@127.0.0.1:5432/pfg_test
          RUN_DB_TESTS: 'true'
          ADMIN_KEY: test-admin-key
          GITHUB_TOKEN: dummy
