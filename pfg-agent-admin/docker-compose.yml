services:
  pfg-agent-admin:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    environment:
      VITE_PFG_AGENT_ADMIN_API_URL: ${VITE_PFG_AGENT_ADMIN_API_URL:-http://localhost:8091}
      CHOKIDAR_USEPOLLING: "true"
      VITE_USE_POLLING: "true"
      VITE_POLL_INTERVAL: "100"
    ports:
      - "${PFG_AGENT_ADMIN_PORT:-5174}:5174"
    volumes:
      - .:/workspace
      - agent_admin_node_modules:/workspace/node_modules

volumes:
  agent_admin_node_modules:
